<h2>Hyde Park Avenue safety</h2><p>Follow the work between Forest Hills station and Walk Hill Street, including crossings, corner visibility, and the changes at Woodlawn Street. Collect observations about how the new layout works.</p>
<h2>Traffic calming on neighborhood streets</h2><p>Follow up on the Wachusett Street speed humps and concerns on Wenham and nearby streets. Coordinate street mural plans with road work.</p>
<h2>Vacant storefronts and community space</h2><p>Explore uses for the empty Velo storefront and access to neighborhood meeting rooms, arts space, and family activities.</p>
<h2>Housing and construction</h2><p>Track proposals on Hyde Park Avenue and Washington Street, including construction schedules, occupied storefronts, and public comment opportunities.</p>
<h2>Neighborhood events and upkeep</h2><p>Organize in-person meetings, block parties, planting, and cleanup days. Make it easier for neighbors to volunteer.</p></template>
